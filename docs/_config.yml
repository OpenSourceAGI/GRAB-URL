# GitHub Pages builds this folder with Jekyll (Settings -> Pages -> "Deploy from
# a branch", folder /docs), which is why this folder still exists after the
# documentation app moved to ../grab-help-docs.
#
# The real documentation site at https://grab.js.org is the Next.js + Fumadocs
# app in `grab-help-docs/`, built with `next build`. All that lives here is the
# index.html redirect below, so Jekyll has nothing it can choke on — no `.mdx`
# sources with JSX expressions, no README with `{{ ... }}` in a code sample.
exclude:
  - node_modules
